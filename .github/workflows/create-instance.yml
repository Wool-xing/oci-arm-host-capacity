name: Create OCI Instance

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    name: Try Create ARM Instance
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress
      - name: Write OCI private key
        run: |
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > /tmp/oci_key.pem
          chmod 600 /tmp/oci_key.pem
      - name: Run instance creation script
        id: oci
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME: /tmp/oci_key.pem
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_OCPUS: ${{ secrets.OCI_OCPUS }}
          OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS }}
          OCI_SHAPE: ${{ secrets.OCI_SHAPE }}
          OCI_MAX_INSTANCES: ${{ secrets.OCI_MAX_INSTANCES }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          CACHE_AVAILABILITY_DOMAINS: 1
          TOO_MANY_REQUESTS_TIME_WAIT: 600
        run: |
          OUTPUT=$(php index.php 2>&1)
          echo "$OUTPUT"
          echo "OCI_OUTPUT<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: PushPlus
        if: ${{ !contains(steps.oci.outputs.OCI_OUTPUT, 'Out of host capacity') && !contains(steps.oci.outputs.OCI_OUTPUT, 'InternalError') }}
        run: |
          INSTANCE_INFO="${{ steps.oci.outputs.OCI_OUTPUT }}"
          curl -s -X POST http://www.pushplus.plus/send \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${{ secrets.PUSHPLUS_TOKEN }}\",\"title\":\"🎉 OCI ARM 服务器创建成功！\",\"content\":\"<pre>${INSTANCE_INFO}</pre>\",\"template\":\"html\"}"

  fix-amd:
    runs-on: ubuntu-latest
    name: Fix AMD Ubuntu (kill old + create new)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3'}
      - run: composer install --prefer-dist --no-progress
      - run: |
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > /tmp/oci_key.pem
          chmod 600 /tmp/oci_key.pem
      - name: Kill old Ubuntu (no SSH)
        continue-on-error: true
        env:
          U: ${{ secrets.OCI_USER_ID }}
          T: ${{ secrets.OCI_TENANCY_ID }}
          F: ${{ secrets.OCI_KEY_FINGERPRINT }}
        run: |
          php -r '
          require_once "vendor/autoload.php";
          $c = new \Hitrov\OciConfig("ap-tokyo-1",getenv("U"),getenv("T"),getenv("F"),"/tmp/oci_key.pem","","","",1,1);
          $a = new \Hitrov\OciApi();
          $id = "ocid1.instance.oc1.ap-tokyo-1.anxhiljrrqqkxxqcgk2h4afv4pxyiiutr3fj6jmbl3slrark3kmuigzvpuia";
          try { $a->call($c,"https://iaas.ap-tokyo-1.oraclecloud.com/20160918/instances/".$id,"DELETE");echo "OK\n";}
          catch(\Exception $e){echo(strpos($e->getMessage(),"JSON")!==false||strpos($e->getMessage(),"Syntax")!==false)?"204\n":"ERR:".$e->getMessage()."\n";}
          '
      - run: sleep 10
      - name: Create new AMD Ubuntu
        id: create
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME: /tmp/oci_key.pem
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ocid1.image.oc1.ap-tokyo-1.aaaaaaaa5xvmxb5y7np7tunegntczkjzb376ou63xif5flq3zo44r7lo3oaq
          OCI_OCPUS: 1
          OCI_MEMORY_IN_GBS: 1
          OCI_SHAPE: VM.Standard.E2.1.Micro
          OCI_MAX_INSTANCES: 3
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          CACHE_AVAILABILITY_DOMAINS: 1
          TOO_MANY_REQUESTS_TIME_WAIT: 60
        run: |
          O=$(php index.php 2>&1)
          echo "$O"
          echo "OUT<<X" >> $GITHUB_OUTPUT
          echo "$O" >> $GITHUB_OUTPUT
          echo "X" >> $GITHUB_OUTPUT
      - name: WeChat
        if: ${{ !contains(steps.create.outputs.OUT, 'Out of host capacity') && !contains(steps.create.outputs.OUT, 'InternalError') }}
        env:
          T: ${{ secrets.PUSHPLUS_TOKEN }}
          O: ${{ steps.create.outputs.OUT }}
        run: curl -s -X POST http://www.pushplus.plus/send -H "Content-Type: application/json" -d "{\"token\":\"${T}\",\"title\":\"AMD Ubuntu Ready\",\"content\":\"<pre>${O}</pre>\",\"template\":\"html\"}"
